services:

  mongo:
    image: mongo:8.2
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-rootpw}

  postgres:
    image: postgres:12
    environment:
      - POSTGRES_DB=te_canvas
      - POSTGRES_USER=te_canvas_user
      - POSTGRES_PASSWORD=RZQZDW47jPaPrn6dkXlgIIK0iN2V5wxF

  node:
    build:
      context: .
      dockerfile: Dockerfile.test
    ports:
      - "8000:8000"
    depends_on: [ mongo, api ]
    environment:
      # NODE_ENV=development activates the /dev-launch LTI bypass in src/lti.js
      - NODE_ENV=development
      - NO_LTI=1
      - LTI_URL=http://localhost:5000

      - MONGO_URL=mongodb://mongo:27017
      - MONGO_USERNAME=${MONGO_USERNAME:-root}
      - MONGO_PASSWORD=${MONGO_PASSWORD:-rootpw}

      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-dev-encryption-key-change-me}

      # Used by the /brand_variables proxy in src/lti.js
      - CANVAS_URL=https://sunet-sandbox.instructure.com

      # Custom LTI properties faked into res.locals.context.custom in dev
      - DEV_CANVAS_GROUP=1
      - DEV_CANVAS_USER=1
    volumes:
      - ./platforms.json:/usr/src/app/platforms.json

  sync:
    image: docker.sunet.se/te-canvas-sync:latest
    depends_on: [ postgres ]
